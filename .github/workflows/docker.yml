name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Each architecture builds on its own native runner and pushes an untagged
  # image by digest. Native ARM runners are free on public repos and avoid QEMU,
  # which would turn a ~2 minute publish into 20-40 minutes under emulation.
  #
  # Both images ship because an Umbrel package cannot build from source — it can
  # only pull pinned, published, multi-arch images.
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: app
            context: .
            target: ''
            suffix: ''
          - name: receipt-extractor
            context: ./receipt-extractor
            target: runtime
            suffix: /receipt-extractor
        platform: [linux/amd64, linux/arm64]
        # Adds runner/arch to each platform without expanding the matrix; the
        # cross product of component x platform is the four jobs we want.
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.component.context }}
          target: ${{ matrix.component.target }}
          platforms: ${{ matrix.platform }}
          # No tags here — the merge job applies them to the manifest list.
          outputs: >-
            type=image,name=ghcr.io/${{ github.repository }}${{ matrix.component.suffix }},push-by-digest=true,name-canonical=true,push=true
          # Separate cache scopes; a shared scope would have the architectures
          # and the two images overwrite each other's layers.
          cache-from: type=gha,scope=${{ matrix.component.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component.name }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.component.name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines each image's per-architecture digests into one tagged manifest
  # list, so `docker pull` resolves correctly on both amd64 and arm64.
  merge:
    runs-on: ubuntu-24.04
    needs: [build]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: app
            suffix: ''
          - name: receipt-extractor
            suffix: /receipt-extractor

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.component.name }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.component.suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}${{ matrix.component.suffix }}@sha256:%s ' *)

      - name: Inspect published manifest
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository }}${{ matrix.component.suffix }}:${{ steps.meta.outputs.version }}
