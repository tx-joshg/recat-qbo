name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs on the same ref are pointless once a newer commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Matches the db image in docker-compose.yml so CI and local agree.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recat_test
      # Without this the *.pg.test.ts suites self-skip and the run looks green
      # while the durable write, lease, and reconciliation paths go untested.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recat_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma migrate deploy

      - run: npm run typecheck

      - run: npm test
