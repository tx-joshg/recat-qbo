services:
  app:
    build: .
    image: ghcr.io/tx-joshg/recat-qbo:latest
    ports:
      # Loopback only by default: until the first admin is created, whoever
      # reaches the setup wizard can claim the instance. Set
      # RECAT_BIND_ADDRESS=0.0.0.0 to serve other machines, ideally after
      # setup or with LOCAL_ADMIN_PASSWORD set (see README).
      - "${RECAT_BIND_ADDRESS:-127.0.0.1}:3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/recat
      APP_URL: ${APP_URL:-http://localhost:3001}
      PORT: 3001
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      QBO_CLIENT_ID: ${QBO_CLIENT_ID:-}
      QBO_CLIENT_SECRET: ${QBO_CLIENT_SECRET:-}
      QBO_ENVIRONMENT: ${QBO_ENVIRONMENT:-sandbox}
      QBO_WEBHOOK_VERIFIER_TOKEN: ${QBO_WEBHOOK_VERIFIER_TOKEN:-}
      QBO_MOCK: ${QBO_MOCK:-false}
      RECEIPT_EXTRACTOR_URL: http://receipt-extractor:8485
      RECEIPT_EXTRACTOR_TOKEN: ${RECEIPT_EXTRACTOR_TOKEN:?set RECEIPT_EXTRACTOR_TOKEN in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Recat <noreply@example.com>}
      LOCAL_ADMIN_EMAIL: ${LOCAL_ADMIN_EMAIL:-}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:-}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      DRY_RUN: ${DRY_RUN:-false}
      ATTACHMENT_COMPANY_QUOTA_BYTES: ${ATTACHMENT_COMPANY_QUOTA_BYTES:-}
      ATTACHMENT_INSTANCE_QUOTA_BYTES: ${ATTACHMENT_INSTANCE_QUOTA_BYTES:-}
      ATTACHMENT_RETENTION_DAYS: ${ATTACHMENT_RETENTION_DAYS:-}
    depends_on:
      db:
        condition: service_healthy
      receipt-extractor:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recat
    volumes:
      - recat-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recat"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  receipt-extractor:
    build:
      context: ./receipt-extractor
    environment:
      RECEIPT_EXTRACTOR_TOKEN: ${RECEIPT_EXTRACTOR_TOKEN:?set RECEIPT_EXTRACTOR_TOKEN in .env}
    expose:
      - "8485"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8485/healthz')
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  recat-pgdata:
